name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: matrix-chat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, openssl, fileinfo, mbstring
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './data/*' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: php tests/run.php
